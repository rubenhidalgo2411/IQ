 wait();
 unsub.push(
  DB.onValue(rf('salas/'+code+'/jugadores'),x=>{lastP=Object.values(x.val()||{});plist();rank()}),
  DB.onValue(rf('salas/'+code+'/resultados'),x=>{lastR=Object.values(x.val()||{});rank()}),
  DB.onValue(rf('salas/'+code+'/meta'),x=>{const m=x.val();if(!m)return leave('La sala se ha cerrado.');if(m.status=='countdown'&&!started)tick(m)}))}
function wait(){hdr();app.innerHTML=`<div class="card c"><p class="mut sm">Código de sala</p><div class="code">${room.code}</div><p class="mut">${room.admin?'Comparte este código. Cuando estén todos, pulsa Empezar.':'Esperando a que el administrador empiece…'}</p><div id="pl" class="l"></div>${room.admin?`<div class="nav" style="justify-content:center;flex-wrap:wrap;align-items:center"><label class="sm mut" for="sc">Cuenta atrás (segundos)</label><input id="sc" type="number" min="3" max="120" value="10" style="width:90px;margin:0"><button class="btn" data-a="start">Empezar el examen</button></div>`:''}<div class="nav" style="justify-content:center"><button class="ghost" data-a="leave">Salir de la sala</button></div><p class="msg" id="msg" role="status"></p></div>`;plist()}
function plist(){const e=$('#pl');if(!e)return;e.innerHTML=`<p class="sm mut">${lastP.length} en la sala</p>`+[...lastP].sort((a,b)=>(a.rol=='admin'?0:1)-(b.rol=='admin'?0:1)||String(a.joinedAt).localeCompare(String(b.joinedAt))).map(p=>`<div class="pl"><b>${esc(p.nombre)}</b><span class="mut sm">${p.rol=='admin'?'administrador':p.estado=='desconectado'?'desconectado':'conectado'}</span></div>`).join('')}
async function goStart(){
 const n=Math.max(3,Math.min(120,+$('#sc').value||10));
 try{await fb.DB.update(rf('salas/'+room.code+'/meta'),{status:'countdown',countdownEndAt:srv()+n*1000,updatedAt:fb.DB.serverTimestamp()})}catch(e){msg(fbErr(e),'err')}}
function tick(m){
 started=true;clearInterval(cdT);
 document.body.insertAdjacentHTML('beforeend','<div class="cd" id="cd" aria-live="assertive"><div><p class="mut">El examen empieza en</p><b id="cn"></b></div></div>');
 const f=()=>{const n=Math.ceil((m.countdownEndAt-srv())/1000);if(n>0){$('#cn').textContent=n;return}clearInterval(cdT);$('#cd').remove();begin()};
 f();cdT=setInterval(f,200)}
function begin(){
 const{DB}=fb;
 if(room.admin)DB.update(rf('salas/'+room.code+'/meta'),{status:'started'}).catch(()=>0);
 DB.update(rf('salas/'+room.code+'/jugadores/'+me.uid),{estado:'en_curso'}).catch(()=>0);
 name=me.nombre;start()}
window.salaIQ={fin(x){
 if(!room||!fb)return;const{DB}=fb;
 DB.set(rf('salas/'+room.code+'/resultados/'+me.uid),{uid:me.uid,nombre:me.nombre,iq:x.iq,mt:x.mt,ind:x.ind,cls:x.cls,dur:x.dur,at:DB.serverTimestamp()}).catch(e=>console.error(e));
 DB.update(rf('salas/'+room.code+'/jugadores/'+me.uid),{estado:'terminado'}).catch(()=>0);
 setTimeout(rank,0)}};
function rank(){
 if(ph||!room||!$('#who'))return;
 let e=$('#rk');if(!e){app.insertAdjacentHTML('beforeend','<div class="card" id="rk" style="margin-top:14px"></div>');e=$('#rk')}
 const rs=[...lastR].sort((a,b)=>b.iq-a.iq),hecho=new Set(rs.map(x=>x.uid)),resto=lastP.filter(p=>!hecho.has(p.id));
 e.innerHTML=`<h2 style="margin-top:0">Clasificación de la sala ${room.code}</h2><div style="overflow-x:auto"><table class="rk"><tr><th>#</th><th>Nombre</th><th>CI</th><th>Intervalo 95 %</th><th>Clasificación</th></tr>${rs.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.nombre)}${x.uid==me.uid?' (tú)':''}</td><td><b>${x.iq}</b></td><td>${x.iq-x.mt} a ${x.iq+x.mt}</td><td>${esc(x.cls)}</td></tr>`).join('')}${resto.map(p=>`<tr><td></td><td>${esc(p.nombre)}</td><td colspan="3" class="mut">${p.estado=='desconectado'?'desconectado':'haciendo el test…'}</td></tr>`).join('')}</table></div><div class="nav" style="justify-content:center"><button class="ghost" data-a="leave">Salir de la sala</button></div>`}
function leave(t){
 unsub.forEach(f=>{try{f()}catch(_){}});unsub=[];clearInterval(cdT);const c=$('#cd');if(c)c.remove();
 if(room&&fb&&!started){const b='salas/'+room.code;fb.DB.remove(rf(room.admin?b:b+'/jugadores/'+me.uid)).catch(()=>0)}
 room=null;started=false;lastP=[];lastR=[];me?lobby():login();if(t)msg(t)}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a=='in')authGo(0);else if(a=='reg')authGo(1);else if(a=='solo')intro();else if(a=='new')mkRoom();else if(a=='join')joinRoom();else if(a=='start')goStart();else if(a=='leave')leave()});
$('#lo').onclick=async()=>{if(room)leave();await fb.AU.signOut(fb.auth)};
addEventListener('keydown',e=>{if(e.key!='Enter')return;const i=e.target.id;if(i=='ap'||i=='au')authGo(0);else if(i=='rc')joinRoom()});
boot();
</script>
</body>
</html>
